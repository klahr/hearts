<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2b44"/>
      <stop offset="1" stop-color="#0c1322"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a5f"/>
      <stop offset="1" stop-color="#c62828"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="96" ry="96" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="96" ry="96" fill="none" stroke="#4a9dff" stroke-opacity="0.35" stroke-width="8"/>
  <!-- the queen of spades -->
  <g transform="rotate(-12 420 500)" filter="url(#shadow)">
    <rect x="230" y="210" width="400" height="568" rx="36" fill="#fbfaf6"/>
    <text x="275" y="330" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="120" fill="#1b1b1b">Q</text>
    <text x="282" y="430" font-family="DejaVu Sans, sans-serif" font-size="100" fill="#1b1b1b">♠</text>
    <rect x="370" y="300" width="220" height="420" rx="18" fill="#eceff1" stroke="#1b1b1b" stroke-width="4"/>
    <text x="480" y="580" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="230" fill="#1b1b1b">♠</text>
  </g>
  <!-- the heart -->
  <path filter="url(#shadow)" fill="url(#heart)" stroke="#fbfaf6" stroke-width="18"
        d="M 690 880 C 600 800, 470 720, 470 590 C 470 505, 535 455, 600 455 C 645 455, 675 480, 690 510 C 705 480, 735 455, 780 455 C 845 455, 910 505, 910 590 C 910 720, 780 800, 690 880 Z"/>
</svg>
